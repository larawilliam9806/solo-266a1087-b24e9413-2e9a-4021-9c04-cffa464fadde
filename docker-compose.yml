services:
  survey:
    build: .
    image: orchard-survey:latest
    container_name: orchard-survey
    ports:
      - "${SURVEY_PORT:-8000}:8000"
    environment:
      SURVEY_DB: /data/survey.sqlite3
      SURVEY_SECRET: ${SURVEY_SECRET:-change-me-in-production}
      # Cap the process address space (MiB).  Imports stream, so 2–3 MB
      # uploads stay far below this; the cap turns a memory regression into a
      # clean import failure instead of an OOM kill.
      SURVEY_MEMORY_LIMIT_MB: ${SURVEY_MEMORY_LIMIT_MB:-192}
    # Mirror the address-space cap at the container level.  The app also sets
    # RLIMIT_AS itself so it works outside Docker too.
    mem_limit: ${SURVEY_MEMORY_LIMIT_MB:-192}m
    volumes:
      - survey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  survey-data:
